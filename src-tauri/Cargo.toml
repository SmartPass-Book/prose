[package]
name = "prose"
version = "0.1.4"
description = "Prose - narrative PR review"
authors = ["Dhruv Sringari"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "prose_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Explicit [[bin]] so the produced executable is `Prose` (capital P) — matters
# in dev mode where the macOS dock / menu bar show the binary's filename
# directly. In production, tauri.conf.json's `productName` controls the .app
# bundle's display name.
[[bin]]
name = "Prose"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
octocrab = "0.49"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
uuid = { version = "1", features = ["v4", "serde"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"

